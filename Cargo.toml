[package]
name = "sideglow"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[[bin]]
name = "SideGlow"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"
# The tray/window icon is rasterized at build time, so the SVG stack stays out of the binary.
resvg = { version = "0.47.0", default-features = false }

[dependencies]
eframe = { version = "0.34.0", default-features = false, features = [
  "wgpu",
  "default_fonts",
] }
parking_lot = "0.12.3"
tray-icon = "0.21.3"
anyhow = "1.0.95"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
windows-capture = "1.1.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61.3"
features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]
