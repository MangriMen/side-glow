[package]
name = "sideglow"
version = "0.1.0"
edition = "2021"
description = "Ambient light for multi-monitor setups on Windows"
license = "MIT"
repository = "https://github.com/MangriMen/side-glow"
readme = "README.md"
keywords = ["ambilight", "ambient-light", "monitor", "windows"]
categories = ["multimedia"]
publish = false
build = "build.rs"

[[bin]]
name = "SideGlow"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.31"
# The tray/window icon is rasterized at build time, so the SVG stack stays out of the binary.
resvg = { version = "0.48.1", default-features = false }

[dependencies]
# `wgpu_no_default_features` + the explicit wgpu below keep only the DX12 backend:
# eframe's `wgpu` feature would also build Vulkan, GLES and the GLSL/SPIR-V writers.
eframe = { version = "0.36.2", default-features = false, features = [
  "wgpu_no_default_features",
  "default_fonts",
] }
# Keep the major in step with the one eframe uses.
wgpu = { version = "30", default-features = false, features = [
  "std",
  "wgsl",
  "parking_lot",
  "dx12",
] }
parking_lot = "0.12.5"
tray-icon = "0.26.0"
anyhow = "1.0.104"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
windows-capture = "2.0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
# A panic ends the process instead of silently killing one thread; ~20% smaller exe.
panic = "abort"
