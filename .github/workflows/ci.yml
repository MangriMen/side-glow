name: CI

on:
  push:
    branches: [main]
    # Docs-only merges don't need a rebuild. Not applied to pull_request, so a required
    # CI check can't leave a docs-only PR waiting for a status that never comes.
    paths-ignore:
      - '**.md'
      - LICENSE
      - .vscode/**
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller, faster dev/test builds and caches; backtraces still have line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # clippy --all-targets also type-checks the examples, so no separate example build.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked
